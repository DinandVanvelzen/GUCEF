; ------------------------------------------------------------
; --- The plugins of the asset converter (debug build)
; --- Order: the groups load in the order of this file and the plugins of a group in the order of the group.
; --- The importer, exporter and cooker plugins of the converter register in the plugin registry of AssetConverterLib
; --- when they load; they are listed in a group after "bootstrap", whose codecs and archives they use.
; ------------------------------------------------------------

; ------------------------------------------------------------
; --- Where the settings of the converter are kept: a copy of AssetConverter_DefaultConfig.json, made on the first
; --- start and made again when it cannot be read
; ------------------------------------------------------------

[ConfigStore]
"ConfigLocation"="$APPCONFIGDIR$/AssetConverter"
"ConfigFileName"="AssetConverter.json"
"DefaultConfigFile"="$MODULEDIR$/AssetConverter_DefaultConfig.json"

[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"
"GroupPriority"="10"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="JSON support (json-parser and json-builder): the settings, manifests, licence records, overrides and the files of the converter"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginJSONPARSER_d"
"AltFilename"="dstorepluginJSONPARSER"
"Type"="GucefDataStoreCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="compression codecs (zlib, deflate): PNG files and zip archives use them"
"Path"="$MODULEDIR$"
"Filename"="codecspluginZLIB_d"
"AltFilename"="codecspluginZLIB"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the archives of libarchive in the VFS: zip, tar, 7z, rar and more, for packs that are archives"
"Path"="$MODULEDIR$"
"Filename"="vfspluginLIBARCHIVE_d"
"AltFilename"="vfspluginLIBARCHIVE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unity packages (.unitypackage) in the VFS, as the project tree they hold, so packages are read in place"
"Path"="$MODULEDIR$"
"Filename"="vfspluginUNITYPACKAGE_d"
"AltFilename"="vfspluginUNITYPACKAGE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="image codecs of FreeImage (png, jpg, tga, psd, tif, exr, ...): the sources of the textures"
"Path"="$MODULEDIR$"
"Filename"="imgpluginFreeImage_d"
"AltFilename"="imgpluginFreeImage"
"Type"="GucefImageCodecPlugin"
"LoadFailAllowed"="true"
"Param"="overrideExistingCodecs=false"

; ------------------------------------------------------------
; --- The importers and exporters of the model formats: they register in the plugin registry of AssetConverterLib
; ------------------------------------------------------------

[Bootstrap\PluginGroup]
"GroupName"="assets"
"LoadImmediately"="true"
"GroupPriority"="20"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="glTF 2.0 import, the glTF writer of the intermediate and the validation of what it writes (cgltf)"
"Path"="$MODULEDIR$"
"Filename"="assetpluginGLTF_d"
"AltFilename"="assetpluginGLTF"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="FBX import (ufbx)"
"Path"="$MODULEDIR$"
"Filename"="assetpluginFBX_d"
"AltFilename"="assetpluginFBX"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unity projects and packages (prefabs, scenes, materials, models with their .meta settings, clips); after the FBX and glTF plugins, whose importers it uses"
"Path"="$MODULEDIR$"
"Filename"="assetpluginUNITY_d"
"AltFilename"="assetpluginUNITY"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Godot 4 import: scenes (.tscn) and mesh resources of a project, with the glTF and FBX files they instance"
"Path"="$MODULEDIR$"
"Filename"="assetpluginGODOT_d"
"AltFilename"="assetpluginGODOT"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unreal editor packages (.uasset, .umap and .mhpkg archives): skeletal meshes with their skeletons and materials; payloads that need Oodle are reported as needing the oodle provider"
"Path"="$MODULEDIR$"
"Filename"="assetpluginUNREAL_d"
"AltFilename"="assetpluginUNREAL"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

; ------------------------------------------------------------
; --- The cookers of the intermediate into runtime files: they register in the plugin registry of AssetConverterLib
; ------------------------------------------------------------

[Bootstrap\PluginGroup]
"GroupName"="cookers"
"LoadImmediately"="true"
"GroupPriority"="30"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the Ogre 1.x cooker (--cook ogre): meshes, skeletons, RTSS material scripts, DotScene files, colliders and textures; Ogre runs headless"
"Path"="$MODULEDIR$"
"Filename"="assetcookerOGRE_d"
"AltFilename"="assetcookerOGRE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"
