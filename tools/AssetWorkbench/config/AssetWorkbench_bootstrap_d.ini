; ------------------------------------------------------------
; --- The plugins of the asset workbench (debug build)
; --- The platform specific ones (windows, input, render systems) may fail to load: only those of the platform exist.
; --- Order: the groups load in the order of this file and the plugins of a group in the order of the group. The Ogre
; --- plugins (type OgrePlugin) are in the group "ogre" after the group "bootstrap", whose Ogre support library
; --- (pluginglueOGRE) registers the plugin manager that loads them into the Ogre Root; GroupPriority makes the order explicit.
; ------------------------------------------------------------

; ------------------------------------------------------------
; --- Where the settings of the workbench are kept: a copy of AssetWorkbench_DefaultConfig.json, made on the first start
; --- and made again when it cannot be read
; ------------------------------------------------------------

[ConfigStore]
"ConfigLocation"="$APPCONFIGDIR$/AssetWorkbench"
"ConfigFileName"="AssetWorkbench.json"
"DefaultConfigFile"="$MODULEDIR$/AssetWorkbench_DefaultConfig.json"

[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"
"GroupPriority"="10"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="JSON support for the settings of the workbench (json-parser and json-builder)"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginJSONPARSER_d"
"AltFilename"="dstorepluginJSONPARSER"
"Type"="GucefDataStoreCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="compression codecs (zlib, deflate): the PNG files of the thumbnails and the zip archives use them"
"Path"="$MODULEDIR$"
"Filename"="codecspluginZLIB_d"
"AltFilename"="codecspluginZLIB"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the encryption codecs of the credential stores (XChaCha20-Poly1305, Argon2id): the sessions of the online stores and the saved passwords are sealed with them"
"Path"="$MODULEDIR$"
"Filename"="codecspluginMONOCYPHER_d"
"AltFilename"="codecspluginMONOCYPHER"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the archives of libarchive in the VFS: zip, tar, 7z, rar and more; also the zip that holds a package, which a zip plugin on files cannot open"
"Path"="$MODULEDIR$"
"Filename"="vfspluginLIBARCHIVE_d"
"AltFilename"="vfspluginLIBARCHIVE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the Parquet table codec: the catalogue of the primary store on the table database of the VFS keeps its tables in it"
"Path"="$MODULEDIR$"
"Filename"="tablecodecpluginPARQUET_d"
"AltFilename"="tablecodecpluginPARQUET"
"Type"="GucefTableCodecPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the table database of the VFS: the catalogue of the primary store (asset sources) lives in tables of its own on any VFS root"
"Path"="$MODULEDIR$"
"Filename"="dbpluginVFSTABLES_d"
"AltFilename"="dbpluginVFSTABLES"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the PostgreSQL backend of the catalogue of the primary store, loaded when it is there and the settings of the primary store name it"
"Path"="$MODULEDIR$"
"Filename"="dbpluginPOSTGRESQL_d"
"AltFilename"="dbpluginPOSTGRESQL"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unity packages (.unitypackage) in the VFS, as the project tree they hold"
"Path"="$MODULEDIR$"
"Filename"="vfspluginUNITYPACKAGE_d"
"AltFilename"="vfspluginUNITYPACKAGE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="image codecs of FreeImage (png, jpg, tga, bmp, psd, ...): the pictures of the texture view, and the codecs that Ogre gets from gucefIMAGE; it loads before the Ogre plugins"
"Path"="$MODULEDIR$"
"Filename"="imgpluginFreeImage_d"
"AltFilename"="imgpluginFreeImage"
"Type"="GucefImageCodecPlugin"
"LoadFailAllowed"="true"
"Param"="overrideExistingCodecs=false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="TrueType fonts (FreeType) for the text of the forms; without it the forms have no text"
"Path"="$MODULEDIR$"
"Filename"="fontpluginFREETYPE_d"
"AltFilename"="fontpluginFREETYPE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the Ogre support library: the Ogre log and Root, the work queue on GUCEF thread pools and the loader of the Ogre plugins below; it loads before them"
"Path"="$MODULEDIR$"
"Filename"="pluginglueOGRE_d"
"AltFilename"="pluginglueOGRE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="windows on Linux (X11): the platform window that the Ogre window is made on"
"Path"="$MODULEDIR$"
"Filename"="guidriverXWinGL_d"
"AltFilename"="guidriverXWinGL"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="windows on Windows (Win32): the platform window that the Ogre window is made on"
"Path"="$MODULEDIR$"
"Filename"="guidriverWin32_d"
"AltFilename"="guidriverWin32"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the window backend Ogre: Ogre render windows on the platform windows, paced by them"
"Path"="$MODULEDIR$"
"Filename"="guidriverOgre_d"
"AltFilename"="guidriverOgre"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the GUI driver ImGuiOgre: the forms of the workbench, drawn by Ogre over the window"
"Path"="$MODULEDIR$"
"Filename"="guidriverImGuiOgre_d"
"AltFilename"="guidriverImGuiOgre"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="mouse and keyboard of X11 windows on Linux"
"Path"="$MODULEDIR$"
"Filename"="inputdriverXWINMSG_d"
"AltFilename"="inputdriverXWINMSG"
"Type"="GucefInputDriverPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="mouse and keyboard of windows on Windows"
"Path"="$MODULEDIR$"
"Filename"="inputdriverMSWINMSG_d"
"AltFilename"="inputdriverMSWINMSG"
"Type"="GucefInputDriverPlugin"
"LoadFailAllowed"="true"

; ------------------------------------------------------------
; --- The importers and exporters of the converter: they register in the plugin registry of AssetConverterLib, which converts the
; --- packs of the primary store (conversion during ingest, and the Convert action of the sources page). Without them packs stay
; --- as original and are marked "conversion pending". The cookers (assetcookerOGRE, for the cook target "ogre" of the settings) are
; --- not loaded here: the workbench renders with the Ogre of its own, and the intermediate glTF of the store opens in the views.
; ------------------------------------------------------------

[Bootstrap\PluginGroup]
"GroupName"="assets"
"LoadImmediately"="true"
"GroupPriority"="15"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="glTF 2.0 import, the glTF writer of the intermediate and the validation of what it writes (cgltf): the conversion step of the primary store"
"Path"="$MODULEDIR$"
"Filename"="assetpluginGLTF_d"
"AltFilename"="assetpluginGLTF"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="FBX import (ufbx) for the conversion step of the primary store"
"Path"="$MODULEDIR$"
"Filename"="assetpluginFBX_d"
"AltFilename"="assetpluginFBX"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unity projects and packages for the conversion step of the primary store; after the FBX and glTF plugins, whose importers it uses"
"Path"="$MODULEDIR$"
"Filename"="assetpluginUNITY_d"
"AltFilename"="assetpluginUNITY"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Godot 4 import for the conversion step of the primary store"
"Path"="$MODULEDIR$"
"Filename"="assetpluginGODOT_d"
"AltFilename"="assetpluginGODOT"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unreal editor packages (.uasset, .umap and .mhpkg archives) for the conversion step of the primary store; payloads that need Oodle are reported as needing the oodle provider"
"Path"="$MODULEDIR$"
"Filename"="assetpluginUNREAL_d"
"AltFilename"="assetpluginUNREAL"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup]
"GroupName"="ogre"
"LoadImmediately"="true"
"GroupPriority"="20"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Ogre render system OpenGL 3+ (Linux and Windows)"
