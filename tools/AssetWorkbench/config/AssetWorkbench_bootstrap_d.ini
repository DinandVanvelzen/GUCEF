; ------------------------------------------------------------
; --- The cooker of the converter for Ogre: the presentation of an effect pack cooks the particle systems of the pack for the 3D view
; --- (particle scripts, materials and a scene). It uses the Ogre of the workbench, so it loads after the Ogre group.
; ------------------------------------------------------------

[Bootstrap\PluginGroup]
"GroupName"="cookers"
"LoadImmediately"="true"
"GroupPriority"="30"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the Ogre cooker of the converter: particle scripts, materials and scenes of the effects that a pack presentation plays"
"Path"="$MODULEDIR$"
"Filename"="assetcookerOGRE_d"
"AltFilename"="assetcookerOGRE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"
