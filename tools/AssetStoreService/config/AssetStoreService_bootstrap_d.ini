; ------------------------------------------------------------
; --- The plugins of the asset store service (AssetStoreService, debug build) in the build directory, next to the program.
; --- The program loads this file through the config store before it reads its settings (--config), so the JSON codec
; --- comes from here. Every plugin is required ("LoadFailAllowed"="false"): without one the program exits with code 3.
; --- In the container image projects/k3s/assetstore/AssetStoreService_bootstrap_container.ini replaces this file: the
; --- same plugins from ../plugins. The list and order are the RuntimeDependencies of ModuleInfo.xml; keep them the same.
; ------------------------------------------------------------

[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="JSON: the settings file and the admin answers (loaded first: the program reads its settings after the bootstrap)"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginJSONPARSER_d"
"AltFilename"="dstorepluginJSONPARSER"
"Type"="GucefDataStoreCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the encryption codecs of the credential store and of the pairing (XChaCha20-Poly1305, Argon2id)"
"Path"="$MODULEDIR$"
"Filename"="codecspluginMONOCYPHER_d"
"AltFilename"="codecspluginMONOCYPHER"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the hash codecs (SHA-256 and others): the digests of uploads and packs"
"Path"="$MODULEDIR$"
"Filename"="codecspluginSTBRUMMEHASH_d"
"AltFilename"="codecspluginSTBRUMMEHASH"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="compression codecs (zlib, deflate)"
"Path"="$MODULEDIR$"
"Filename"="codecspluginZLIB_d"
"AltFilename"="codecspluginZLIB"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the PostgreSQL backend of the catalogue"
"Path"="$MODULEDIR$"
"Filename"="dbpluginPOSTGRESQL_d"
"AltFilename"="dbpluginPOSTGRESQL"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the table database of the VFS (the vfstables catalogue type)"
"Path"="$MODULEDIR$"
"Filename"="dbpluginVFSTABLES_d"
"AltFilename"="dbpluginVFSTABLES"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the Parquet table codec of the table database"
"Path"="$MODULEDIR$"
"Filename"="tablecodecpluginPARQUET_d"
"AltFilename"="tablecodecpluginPARQUET"
"Type"="GucefTableCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the archives of libarchive in the VFS: zip, tar, 7z, rar and more (packs)"
"Path"="$MODULEDIR$"
"Filename"="vfspluginLIBARCHIVE_d"
"AltFilename"="vfspluginLIBARCHIVE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unity packages (.unitypackage) in the VFS, as the project tree they hold: packs that are Unity packages are read in place"
"Path"="$MODULEDIR$"
"Filename"="vfspluginUNITYPACKAGE_d"
"AltFilename"="vfspluginUNITYPACKAGE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="image codecs of FreeImage (png, jpg, tga, psd, tif, exr, ...): the importers read the textures of a pack and the cooker its texture files through them"
"Path"="$MODULEDIR$"
"Filename"="imgpluginFreeImage_d"
"AltFilename"="imgpluginFreeImage"
"Type"="GucefImageCodecPlugin"
"LoadFailAllowed"="false"
"Param"="overrideExistingCodecs=false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="glTF 2.0 import and the glTF writer of the converter hook"
"Path"="$MODULEDIR$"
"Filename"="assetpluginGLTF_d"
"AltFilename"="assetpluginGLTF"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="FBX import (ufbx)"
"Path"="$MODULEDIR$"
"Filename"="assetpluginFBX_d"
"AltFilename"="assetpluginFBX"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unity projects and packages (prefabs, scenes, materials, models with their .meta settings, clips); after the FBX and glTF plugins, whose importers it uses"
"Path"="$MODULEDIR$"
"Filename"="assetpluginUNITY_d"
"AltFilename"="assetpluginUNITY"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Godot 4 import: scenes (.tscn) and mesh resources of a project, with the glTF and FBX files they instance"
"Path"="$MODULEDIR$"
"Filename"="assetpluginGODOT_d"
"AltFilename"="assetpluginGODOT"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unreal editor packages (.uasset, .umap and .mhpkg archives): skeletal meshes, skeletons and materials into the intermediate scene"
"Path"="$MODULEDIR$"
"Filename"="assetpluginUNREAL_d"
"AltFilename"="assetpluginUNREAL"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the Ogre 1.x cooker (the cook target ogre, and gucef-ogre3d as its alias): meshes, skeletons, material scripts, DotScene files, colliders and textures into the cooked area of a pack. Ogre runs headless, without a render system and without Ogre plugins"
"Path"="$MODULEDIR$"
"Filename"="assetcookerOGRE_d"
"AltFilename"="assetcookerOGRE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

