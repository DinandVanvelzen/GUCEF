; ------------------------------------------------------------
; --- The plugins of the asset viewer (debug build)
; --- The platform specific ones (windows, input, render systems) may fail to load: only those of the platform exist.
; --- Order: the groups load in the order of this file and the plugins of a group in the order of the group. The Ogre
; --- plugins (type OgrePlugin) are in the group "ogre" after the group "bootstrap", whose Ogre support library
; --- (pluginglueOGRE) registers the plugin manager that loads them into the Ogre Root; GroupPriority makes the order explicit.
; ------------------------------------------------------------

; ------------------------------------------------------------
; --- Where the settings of the viewer are kept: a copy of AssetViewer_DefaultConfig.json, made on the first start
; --- and made again when it cannot be read
; ------------------------------------------------------------

[ConfigStore]
"ConfigLocation"="$APPCONFIGDIR$/AssetViewer"
"ConfigFileName"="AssetViewer.json"
"DefaultConfigFile"="$MODULEDIR$/AssetViewer_DefaultConfig.json"

[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"
"GroupPriority"="10"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="JSON support for the settings of the viewer (json-parser and json-builder)"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginJSONPARSER_d"
"AltFilename"="dstorepluginJSONPARSER"
"Type"="GucefDataStoreCodecPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="compression codecs (zlib, deflate): the PNG files of the thumbnails and the zip archives use them"
"Path"="$MODULEDIR$"
"Filename"="codecspluginZLIB_d"
"AltFilename"="codecspluginZLIB"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the archives of libarchive in the VFS: zip, tar, 7z, rar and more; also the zip that holds a package, which a zip plugin on files cannot open"
"Path"="$MODULEDIR$"
"Filename"="vfspluginLIBARCHIVE_d"
"AltFilename"="vfspluginLIBARCHIVE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Unity packages (.unitypackage) in the VFS, as the project tree they hold"
"Path"="$MODULEDIR$"
"Filename"="vfspluginUNITYPACKAGE_d"
"AltFilename"="vfspluginUNITYPACKAGE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="image codecs of FreeImage (png, jpg, tga, bmp, psd, ...): the pictures of the texture view, and the codecs that Ogre gets from gucefIMAGE; it loads before the Ogre plugins"
"Path"="$MODULEDIR$"
"Filename"="imgpluginFreeImage_d"
"AltFilename"="imgpluginFreeImage"
"Type"="GucefImageCodecPlugin"
"LoadFailAllowed"="true"
"Param"="overrideExistingCodecs=false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="TrueType fonts (FreeType) for the text of the forms; without it the forms have no text"
"Path"="$MODULEDIR$"
"Filename"="fontpluginFREETYPE_d"
"AltFilename"="fontpluginFREETYPE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the Ogre support library: the Ogre log and Root, the work queue on GUCEF thread pools and the loader of the Ogre plugins below; it loads before them"
"Path"="$MODULEDIR$"
"Filename"="pluginglueOGRE_d"
"AltFilename"="pluginglueOGRE"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="windows on Linux (X11): the platform window that the Ogre window is made on"
"Path"="$MODULEDIR$"
"Filename"="guidriverXWinGL_d"
"AltFilename"="guidriverXWinGL"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="windows on Windows (Win32): the platform window that the Ogre window is made on"
"Path"="$MODULEDIR$"
"Filename"="guidriverWin32_d"
"AltFilename"="guidriverWin32"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the window backend Ogre: Ogre render windows on the platform windows, paced by them"
"Path"="$MODULEDIR$"
"Filename"="guidriverOgre_d"
"AltFilename"="guidriverOgre"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="the GUI driver ImGuiOgre: the forms of the viewer, drawn by Ogre over the window"
"Path"="$MODULEDIR$"
"Filename"="guidriverImGuiOgre_d"
"AltFilename"="guidriverImGuiOgre"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="mouse and keyboard of X11 windows on Linux"
"Path"="$MODULEDIR$"
"Filename"="inputdriverXWINMSG_d"
"AltFilename"="inputdriverXWINMSG"
"Type"="GucefInputDriverPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="mouse and keyboard of windows on Windows"
"Path"="$MODULEDIR$"
"Filename"="inputdriverMSWINMSG_d"
"AltFilename"="inputdriverMSWINMSG"
"Type"="GucefInputDriverPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup]
"GroupName"="ogre"
"LoadImmediately"="true"
"GroupPriority"="20"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Ogre render system OpenGL 3+ (Linux and Windows)"
"Path"="$MODULEDIR$"
"Filename"="OgreRenderSystem_GL3Plus_d"
"AltFilename"="OgreRenderSystem_GL3Plus"
"Type"="OgrePlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Ogre render system Direct3D 11 (Windows)"
"Path"="$MODULEDIR$"
"Filename"="OgreRenderSystem_Direct3D11_d"
"AltFilename"="OgreRenderSystem_Direct3D11"
"Type"="OgrePlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="The Vulkan render system of Ogre, the renderer that --renderer Vulkan picks; without a Vulkan driver it offers no renderer"
"Path"="$MODULEDIR$"
"Filename"="OgreRenderSystem_Vulkan_d"
"AltFilename"="OgreRenderSystem_Vulkan"
"Type"="OgrePlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="The compiler of the programs of the Vulkan render system: GLSL to SPIR-V with glslang"
"Path"="$MODULEDIR$"
"Filename"="OgrePlugin_GLSLangProgramManager_d"
"AltFilename"="OgrePlugin_GLSLangProgramManager"
"Type"="OgrePlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Ogre reads all its files through the GUCEF VFS"
"Path"="$MODULEDIR$"
"Filename"="OgrePlugin_GucefVFS_d"
"AltFilename"="OgrePlugin_GucefVFS"
"Type"="OgrePlugin"
"LoadFailAllowed"="false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Ogre decodes pictures (png, jpg, ...) with the gucefIMAGE codecs"
"Path"="$MODULEDIR$"
"Filename"="OgreCodec_GucefIMAGE_d"
"AltFilename"="OgreCodec_GucefIMAGE"
"Type"="OgrePlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Ogre reads the source models (FBX, glTF, OBJ, DAE, ...) with Assimp"
"Path"="$MODULEDIR$"
"Filename"="OgreCodec_Assimp_d"
"AltFilename"="OgreCodec_Assimp"
"Type"="OgrePlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Ogre reads scenes of the DotScene format (.scene)"
"Path"="$MODULEDIR$"
"Filename"="OgrePlugin_DotScene_d"
"AltFilename"="OgrePlugin_DotScene"
"Type"="OgrePlugin"
"LoadFailAllowed"="true"

