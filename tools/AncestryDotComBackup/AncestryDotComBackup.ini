; Settings of AncestryDotComBackup. Command line settings (setting=value) win over these.

[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Data storage codec plugin which provides JSON support using json-parser and json-builder"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginJSONPARSER"
"AltFilename"="dstorepluginJSONPARSER_d"
"Type"="GucefDataStoreCodecPlugin"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Codec plugin with the hash codecs, the web socket handshake needs sha1"
"Path"="$MODULEDIR$"
"Filename"="codecspluginSTBRUMMEHASH"
"AltFilename"="codecspluginSTBRUMMEHASH_d"
"Type"="GucefStandardCodecPlugin"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Codec plugin with zlib compression"
"Path"="$MODULEDIR$"
"Filename"="codecspluginZLIB"
"AltFilename"="codecspluginZLIB_d"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="HTTP client backend based on curl, for https"
"Path"="$MODULEDIR$"
"Filename"="httpclientpluginCURL"
"AltFilename"="httpclientpluginCURL_d"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Plugin for reading archives such as zip files with the VFS, the GEDCOM export comes as a zip file"
"Path"="$MODULEDIR$"
"Filename"="vfspluginLIBARCHIVE"
"AltFilename"="vfspluginLIBARCHIVE_d"
"Type"="GucefGenericPlugin"
"LoadFailAllowed"="true"

[Main/AppArgs]
"dataDir"="data"
"treeId"="default"
"debugPort"="9222"
"startUrl"="https://www.ancestry.com/"
"cookieDomain"="ancestry.com"
"hostFilter"="ancestry"
