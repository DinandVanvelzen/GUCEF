
[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Data storage codec plugin which provides XML support using Parsifal XML"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginPARSIFALXML"
"Type"="GucefDataStoreCodecPlugin"

;[Bootstrap\PluginGroup\PluginMetaData]
;"Description"="ProjectGen plugin preprocesses directories with VS projects into ModuleInfo.xml"
;"Path"="$MODULEDIR$"
;"Filename"="ProjectGenVSImporter"
;"Type"="GucefGenericPlugin"

;[Bootstrap\PluginGroup\PluginMetaData]
;"Description"="ProjectGen plugin which filters projects not listed in Depends output"
;"Path"="$MODULEDIR$"
;"Filename"="ProjectGenDependsFilter"
;"Type"="GucefGenericPlugin"

[Bootstrap\Main\AppArgs]
"outputDir"="$CURWORKDIR$"
"rootDir"="$MODULEDIR$\..\..\..\"
"generators"="xml;cmake;premake4;premake5;androidmake"
"disabledPlatforms"=""
"addToolCompileTimeToOutput"="false"
"writeLogLocationToOutput"="false"
"useProjectInfoCache"="false"
"dirsToIgnore"=".svn;.git"
"DependsFilter"=""
"TreatTagsAsOptions"="true"
"TaggedOptionsEnabledDefault"="true"
"premake4gen:TemplateDir"=""
"premake4gen:PM4OutputDir"=""
"premake4gen:PM4TargetDir"=""
"cmakgen:TemplateDir"=""
"cmakegen:PresetsRootDir"="$MODULEDIR$\..\..\..\"
"cmakegen:PresetGenerators"="VS2026;ClangCL;Ninja;Emscripten;Android-arm64;Android-arm32;Android-x86_64"
"cmakegen:PresetArchitectures"="x64"
"cmakegen:PresetBinaryDirBase"=""
"cmakegen:PlatformDefaults"="Windows:VS2026-x64;Linux:Ninja-x64;Darwin:Ninja-x64"