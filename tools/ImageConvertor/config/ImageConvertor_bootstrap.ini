; ------------------------------------------------------------
; --- The plugins of the image convertor
; --- Order: the groups load in the order of this file and the plugins of a group in the order of the group.
; --- A codec of a plugin that is already registered stays: FreeImage is first, DevIL only adds what FreeImage does not have.
; --- More image codec plugins are given on the command line with --plugin.
; ------------------------------------------------------------

[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"
"GroupPriority"="10"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="compression codecs (zlib, deflate): PNG files and the native image format use them"
"Path"="$MODULEDIR$"
"Filename"="codecspluginZLIB"
"AltFilename"="codecspluginZLIB_d"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="image codecs of FreeImage (png, jpg, tga, psd, tif, exr, gif, ...)"
"Path"="$MODULEDIR$"
"Filename"="imgpluginFreeImage"
"AltFilename"="imgpluginFreeImage_d"
"Type"="GucefImageCodecPlugin"
"LoadFailAllowed"="true"
"Param"="overrideExistingCodecs=false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="image codecs of DevIL, for the formats FreeImage does not have"
"Path"="$MODULEDIR$"
"Filename"="imgpluginDEVIL"
"AltFilename"="imgpluginDEVIL_d"
"Type"="GucefImageCodecPlugin"
"LoadFailAllowed"="true"
"Param"="overrideExistingCodecs=false"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="animations (FLC and FLI)"
"Path"="$MODULEDIR$"
"Filename"="imgpluginFLIC"
"AltFilename"="imgpluginFLIC_d"
"Type"="GucefStandardCodecPlugin"
"LoadFailAllowed"="true"
