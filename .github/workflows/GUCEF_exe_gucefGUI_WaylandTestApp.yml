name: target_GUCEF_exe_gucefGUI_WaylandTestApp

on:
  workflow_dispatch:
    inputs:
      archiveBuildArtifacts:
        description: 'Archive Build Artifacts?'
        required: false
        default: 'false'
      targetPlatform:
        description: 'Target platform to build?'
        required: false
        default: 'all'

jobs:

  GUCEF_exe_gucefGUI_WaylandTestApp-linux32:
    runs-on: self-hosted
    env:
      TARGET_NAME: GUCEF_exe_gucefGUI_WaylandTestApp
      TARGET_PLATFORM: linux32
      TARGET_PROJECT: projects/CMake/targets/GUCEF_exe_gucefGUI_WaylandTestApp
      PRODUCT_NAME: gucefGUI_WaylandTestApp
      CI_TOOL: GITHUB-ACTIONS
      BUILD_TOOL: CMAKE
    steps:
      - uses: actions/checkout@master
      - name: Build gucefGUI_WaylandTestApp for platform linux32
        run: ./projects/CI/targets/ci_build.sh
      - name: Archive Debian build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: Debian packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux32/packages/*gucefGUI_WaylandTestApp*.deb
      - name: Archive RPM build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: RPM packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux32/packages/*gucefGUI_WaylandTestApp*.rpm
      - name: Archive Tarball - bz2 compressed build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: tar.bz2 packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux32/packages/*gucefGUI_WaylandTestApp*.tar.bz2
      - name: Archive Tarball - Xz compressed build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: tar.xz packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux32/packages/*gucefGUI_WaylandTestApp*.tar.xz
  GUCEF_exe_gucefGUI_WaylandTestApp-linux64:
    runs-on: self-hosted
    env:
      TARGET_NAME: GUCEF_exe_gucefGUI_WaylandTestApp
      TARGET_PLATFORM: linux64
      TARGET_PROJECT: projects/CMake/targets/GUCEF_exe_gucefGUI_WaylandTestApp
      PRODUCT_NAME: gucefGUI_WaylandTestApp
      CI_TOOL: GITHUB-ACTIONS
      BUILD_TOOL: CMAKE
    steps:
      - uses: actions/checkout@master
      - name: Build gucefGUI_WaylandTestApp for platform linux64
        run: ./projects/CI/targets/ci_build.sh
      - name: Archive Debian build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: Debian packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux64/packages/*gucefGUI_WaylandTestApp*.deb
      - name: Archive RPM build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: RPM packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux64/packages/*gucefGUI_WaylandTestApp*.rpm
      - name: Archive Tarball - bz2 compressed build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: tar.bz2 packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux64/packages/*gucefGUI_WaylandTestApp*.tar.bz2
      - name: Archive Tarball - Xz compressed build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: tar.xz packages
          path: |
            ./common/bin/GUCEF_exe_gucefGUI_WaylandTestApp-linux64/packages/*gucefGUI_WaylandTestApp*.tar.xz
