; ------------------------------------------------------------
; --- The plugin of the gucefIrcHub image (projects/k3s/irc/hub). stage_install.sh installs this file as
; --- config/gucefIrcHub_bootstrap.ini and puts the plugin it names in ../plugins; PLUGIN_LINKS of service.env links
; --- it into bin/, where the program looks for it ($MODULEDIR$). check_libs.sh fails the image build when the
; --- plugin is missing.
; ------------------------------------------------------------

[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="JSON: the settings file of the hub"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginJSONPARSER"
"AltFilename"="dstorepluginJSONPARSER_d"
"Type"="GucefDataStoreCodecPlugin"
"LoadFailAllowed"="false"
