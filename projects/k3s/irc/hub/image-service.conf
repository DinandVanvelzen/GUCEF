# The container image of gucefIrcHub, built by projects/k3s/gucef_service/scripts/build_image.sh (the CI image job uses it
# with --push). This file (the service file of the kit, not a secret) is only read by the image build: the Deployment of the hub is rendered by ../setup.sh, which
# keeps the build-image.sh of this directory for the image of a single machine.
SERVICE_NAME=irc-hub
SERVICE_PROGRAM=gucefIrcHub
IMAGE_NAME=vanvelzen/gucef-irc-hub
IMAGE_TAG=dev
IMAGE_TARGETS="GUCEF_exe_gucefIrcHub"
TARGETS_CHECKOUT=GUCEF
BOOTSTRAP_INI=gucefIrcHub_bootstrap_container.ini
# the program loads its JSON plugin from the directory of the program ($MODULEDIR$)
PLUGIN_LINKS="bin"
# gucefCORE links libX11 (the desktop console windows of the program), which is not used here
RUNTIME_EXTRA_PACKAGES="libx11-6"
