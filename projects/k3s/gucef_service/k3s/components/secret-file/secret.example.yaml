# Example only: not part of any kustomization and never applied. The Secret of components/secret-file is created in the
# cluster from a file or a pipe, so the value is never in a file of a repository, on a command line or in the output:
#
#   kubectl -n @NAMESPACE@ create secret generic @SECRET_FILE_SECRET_NAME@ --from-file=@SECRET_FILE_KEY@=<file holding only the value, mode 0600>
#
# or, with the value in a variable of an env file (read in a subshell, written to a pipe, never printed):
#
#   ( set -a; . <env file>; printf '%s' "$<VARIABLE>" ) | kubectl -n @NAMESPACE@ create secret generic @SECRET_FILE_SECRET_NAME@ --from-file=@SECRET_FILE_KEY@=/dev/stdin
#
# With KUBECTL="ssh k3smaster kubectl" the same pipe works (ssh passes standard input to the remote kubectl). The
# namespace must exist first (deploy.sh makes it and stops there while the Secret is missing). To replace the value:
# kubectl -n @NAMESPACE@ delete secret @SECRET_FILE_SECRET_NAME@, create it again, kubectl -n @NAMESPACE@ rollout restart
# deployment/@SERVICE_NAME@. Sealed Secrets (projects/k3s/sealed-secrets) are the alternative for a value kept in git.
apiVersion: v1
kind: Secret
metadata:
  name: @SECRET_FILE_SECRET_NAME@
  namespace: @NAMESPACE@
type: Opaque
data:
  @SECRET_FILE_KEY@: "<base64 of the value; made by kubectl create secret, never written here>"
