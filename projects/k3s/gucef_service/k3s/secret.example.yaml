# Example only: not part of kustomization.yaml and never applied. The credentials key Secret is created from a key file
# in the cluster, so the key is never in a file of a repository:
#
#   kubectl -n @NAMESPACE@ create secret generic @CREDENTIALS_SECRET_NAME@ --from-file=credentials.key=<key file>
#
# (or sealed with the cluster's Sealed Secrets, as projects/k3s/postgresql/create-sealed-secret.sh does). The key file is
# made by the service's own tooling. components/credentials-key mounts the Secret.
apiVersion: v1
kind: Secret
metadata:
  name: @CREDENTIALS_SECRET_NAME@
  namespace: @NAMESPACE@
type: Opaque
data:
  credentials.key: "<base64 of the key file; made by kubectl create secret, never written here>"
