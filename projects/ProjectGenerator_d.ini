
[Bootstrap\PluginGroup]
"GroupName"="bootstrap"
"LoadImmediately"="true"

[Bootstrap\PluginGroup\PluginMetaData]
"Description"="Data storage codec plugin which provides XML support using Parsifal XML"
"Path"="$MODULEDIR$"
"Filename"="dstorepluginPARSIFALXML_d"
"AltFilename"="dstorepluginPARSIFALXML"
"Type"="GucefDataStoreCodecPlugin"

;[Bootstrap\PluginGroup\PluginMetaData]
;"Description"="ProjectGen plugin preprocesses directories with VS projects into ModuleInfo.xml"
;"Path"="$ENVVAR:GUCEF_HOME$"
;"Filename"="ProjectGenVSImporter_d"
;"AltFilename"="ProjectGenVSImporter"
;"Type"="GucefGenericPlugin"

;[Bootstrap\PluginGroup\PluginMetaData]
;"Description"="ProjectGen plugin which filters projects not listed in Depends output"
;"Path"="$ENVVAR:GUCEF_HOME$"
;"Filename"="ProjectGenDependsFilter_d"
;"AltFilename"="ProjectGenDependsFilter"
;"Type"="GucefGenericPlugin"

[ProjectGenerator\PlatformDefinitions\linux32]
"Aliases"="linux;linuxlike"
"PlatformDirs"="linux32;linux"

[ProjectGenerator\PlatformDefinitions\linux64]
"Aliases"="linux;linuxlike"
"PlatformDirs"="linux64;linux"

[ProjectGenerator\PlatformDefinitions\unix]
"PlatformDirs"="unix"

[ProjectGenerator\PlatformDefinitions\win32]
"Aliases"="mswin;windows"
"PlatformDirs"="win32;mswin;windows"

[ProjectGenerator\PlatformDefinitions\win64]
"Aliases"="mswin;windows"
"PlatformDirs"="win64;mswin;windows"

[ProjectGenerator\PlatformDefinitions\ios]
"Aliases"="iphone;iphoneos"
"PlatformDirs"="ios;iphone;iphoneos"

[ProjectGenerator\PlatformDefinitions\osx]
"Aliases"="mac;macos;macosx"
"PlatformDirs"="osx;mac;macos;macosx"

[ProjectGenerator\PlatformDefinitions\symbian]
"PlatformDirs"="symbian"

[ProjectGenerator\PlatformDefinitions\android32]
"Aliases"="android;linuxlike"
"PlatformDirs"="android;android32"

[ProjectGenerator\PlatformDefinitions\android64]
"Aliases"="android;linuxlike"
"PlatformDirs"="android;android64"

[ProjectGenerator\PlatformDefinitions\sdl]
"PlatformDirs"="sdl"

[ProjectGenerator\PlatformDefinitions\emscripten32]
"Aliases"="emscripten;linuxlike"
"PlatformDirs"="emscripten;emscripten32"

[ProjectGenerator\PlatformDefinitions\emscripten64]
"Aliases"="emscripten;linuxlike"
"PlatformDirs"="emscripten;emscripten64"

[ProjectGenerator\PlatformDefinitions\nacl]
"PlatformDirs"="nacl"

[ProjectGenerator\PlatformDefinitions\glx]
"PlatformDirs"="glx"

[ProjectGenerator\PlatformDefinitions\gtk]
"PlatformDirs"="gtk"

[ProjectGenerator\PlatformDefinitions\posix]
"PlatformDirs"="posix"

[ProjectGenerator\PlatformDefinitions\arduino]
"PlatformDirs"="arduino"

[Bootstrap\Main\AppArgs]
"outputDir"="$ENVVAR:GUCEF_HOME$"
"rootDir"="$ENVVAR:GUCEF_HOME$"
"projectName"="GUCEF"
"useProjectInfoCache"="true"
"generators"="xml;cmake;androidmake;cihelper;premake4;premake5;arduinocli"
"disabledPlatforms"="nacl;gtk;glx;sdl;symbian;unix;posix"
"addToolCompileTimeToOutput"="false"
"writeLogLocationToOutput"="false"
"MinimalLogLevel"="25000"
"dirsToIgnore"=".svn;_svn;.git"
"DependsFilter"=""
"cmakegen:TemplateDir"="$ENVVAR:GUCEF_HOME$/projects/CMake/ProjectGenTemplates"
"cmakegen:TargetsDir"="$ENVVAR:GUCEF_HOME$/projects/CMake/targets"
"cmakegen:SplitTargets"="true"
"premake4gen:TemplateDir"="$ENVVAR:GUCEF_HOME$/projects/premake4/ProjectGenTemplates"
"premake4gen:PM4OutputDir"="ENVVAR:PM4OUTPUTDIR"
"premake4gen:PM4TargetDir"="ENVVAR:PM4TARGETDIR"
"premake5gen:TemplateDir"="$ENVVAR:GUCEF_HOME$/projects/premake5/ProjectGenTemplates"
"premake5gen:PM5OutputDir"="ENVVAR:PM5OUTPUTDIR"
"premake5gen:PM5TargetDir"="ENVVAR:PM5TARGETDIR"
"premake5gen:TargetsDir"="$ENVVAR:GUCEF_HOME$/projects/premake5/targets"
"premake5gen:SplitTargets"="true"
"androidmakegen:TargetsDir"="$ENVVAR:GUCEF_HOME$/projects/Android/targets"
"androidmakegen:SplitTargets"="true"
"cihelpergen:TargetsDir"="$ENVVAR:GUCEF_HOME$/projects/CI/targets"
"cihelpergen:platformFilter"="all,linux32,linux64,win32,win64"
"cihelpergen:GenerateFilePathListPerTarget"="false"
"cihelpergen:GeneratePathListPerTarget"="false"
"cihelpergen:GenerateGlobPatternPathListPerTarget"="true"
"cihelpergen:GenerateDockerfilesPerTarget"="true"
"cihelpergen:PrefixWorkflowFilenameWithProjectGenAutoGen"="false"
"cihelpergen:GenerateGithubActionsWorkflowTargetsYml"="true"
"cihelpergen:GithubActionsWorkflowsUseSelfHostedRunners"="true"
"cihelpergen:GithubActionsWorkflowUsesWorkflowEventDispatch"="true"
"arduinocligen:TargetsDir"="$ENVVAR:GUCEF_HOME$/projects/Arduino/targets"
"arduinocligen:SplitTargets"="true"
"arduinocligen:ArduinoCLIOutputDir"="$ENVVAR:GUCEF_HOME$/common/bin/Arduino"
"arduinocligen:OnlyConsiderSpecificTags"="true"
"arduinocligen:ValidTags"="platform"
